[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline-testing-platform"
version = "1.0.0"
description = "Testing platform for data pipelines: declarative suites, deterministic replay, diff regression testing, fail-closed quality gates"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
