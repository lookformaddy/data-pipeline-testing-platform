# GitHub Actions CI for the Data Pipeline Testing Platform.
#
# NOTE: this file ships as docs/github-actions-ci.yml (not
# .github/workflows/ci.yml) because the GitHub App integration used to push
# this repository cannot write workflow files. To activate CI, move it to
# .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Run demo smoke test
        run: PYTHONPATH=src python scripts/demo.py
